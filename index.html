<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMM Zone UI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      padding: 15px;
      text-align: center;
    }
    /* সবুজ বাটন */
    .green-btn {
      background-color: #28a745;
      color: white;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    /* লাল বাটন */
    .red-btn {
      background-color: #dc3545;
      color: white;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- কাস্টম সবুজ বাটন -->
  <button class="green-btn" onclick="sendData('ORDER')">ORDER</button>

  <!-- কাস্টম লাল বাটন -->
  <button class="red-btn" onclick="sendData('ORDER CHECK')">ORDER CHECK</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // টেলিগ্রামে ফুল-স্ক্রিন ভিউ অন করা

    function sendData(action) {
      // বাটনে ক্লিক করলে ডাটা টেলিগ্রাম বটের পাইথনে চলে যাবে
      tg.sendData(action);
    }
  </script>
</body>
</html>
